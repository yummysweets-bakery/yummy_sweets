<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yummy Sweets — Artisanal Boutique Bakery</title>
  <meta name="description" content="Handcrafted cakes, cupcakes, and desserts baked fresh daily with organic ingredients. Order directly via WhatsApp from Yummy Sweets." />
  <meta name="theme-color" content="#8B4A32" />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Yummy Sweets — Artisanal Boutique Bakery" />
  <meta property="og:description" content="Handcrafted artisan cakes & desserts. Freshly baked daily, delivered to your doorstep from Yummy Sweets." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=1200&auto=format&fit=crop&q=80" />
  <meta property="og:site_name" content="Yummy Sweets" />
  <!--SITE_URL_META: canonical + og:url are added by builder/assemble.js when SITE_URL is set-->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Google Fonts: only the default pairing loads with the page; other families load on demand (builder/lib/fonts.js) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Structured data. Contact fields are filled in at runtime from the shop config (builder/lib/seo.js);
       nothing here is a placeholder for the business's real details. -->
  <script type="application/ld+json" id="ldJson">
  {
    "@context": "https://schema.org",
    "@type": "Bakery",
    "name": "Yummy Sweets",
    "description": "Artisanal boutique bakery crafting bespoke layer cakes, gourmet cupcakes, and delicate French desserts.",
    "address": { "@type": "PostalAddress", "addressLocality": "Erbil", "addressCountry": "IQ" }
  }
  </script>
